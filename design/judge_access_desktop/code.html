<style>
        .material-symbols-outlined {
          font-variation-settings:
          'FILL' 0,
          'wght' 400,
          'GRAD' 0,
          'opsz' 24
        }
        .material-symbols-outlined[data-weight="fill"] {
            font-variation-settings: 'FILL' 1;
        }
        
        .bg-pattern {
            background-image: radial-gradient(var(--tw-colors-outline-variant) 1px, transparent 1px);
            background-size: 24px 24px;
        }
    </style>

<body class="bg-background text-on-background min-h-screen flex flex-col antialiased">
<!-- Transactional page: Nav/Footer shell suppressed -->
<main class="flex-grow flex items-center justify-center p-margin-desktop bg-surface-container-low relative overflow-hidden">
<!-- Abstract decorative background elements -->
<div class="absolute inset-0 bg-pattern opacity-30 pointer-events-none"></div>
<div class="absolute -top-32 -left-32 w-96 h-96 bg-primary-container/20 rounded-full blur-3xl"></div>
<div class="absolute -bottom-32 -right-32 w-[500px] h-[500px] bg-secondary-container/10 rounded-full blur-3xl"></div>
<div class="relative w-full max-w-md z-10">
<!-- Login Card -->
<div class="bg-surface-container-lowest rounded-[1.5rem] shadow-xl border-2 border-outline-variant overflow-hidden">
<!-- Branding Header -->
<div class="bg-primary p-lg text-center relative overflow-hidden">
<div class="absolute inset-0 opacity-10 bg-[url('placeholder')] bg-cover bg-center" data-alt="Close-up abstract shot of toasted artisan bread textures, warm golden lighting, high contrast, creating a subtle textured background pattern for a high-end sandwich championship interface."></div>
<div class="relative z-10 flex flex-col items-center">
<span class="material-symbols-outlined text-5xl text-on-primary mb-sm" data-weight="fill">gavel</span>
<h1 class="font-headline-lg text-headline-lg text-on-primary">Judge Access</h1>
<p class="font-body-md text-body-md text-primary-fixed mt-xs">Sandwich Championship 2024</p>
</div>
</div>
<!-- Form Section -->
<div class="p-lg">
<form action="#" class="space-y-md" method="POST">
<div class="space-y-sm relative">
<label class="block font-label-bold text-label-bold text-on-surface" for="judge_id">Panelist ID</label>
<div class="relative">
<span class="absolute inset-y-0 left-0 flex items-center pl-sm pointer-events-none">
<span class="material-symbols-outlined text-outline">badge</span>
</span>
<input class="w-full pl-xl pr-sm py-sm bg-surface rounded-lg border-2 border-outline focus:border-primary focus:ring-4 focus:ring-primary/20 transition-all font-body-md text-body-md text-on-surface placeholder-on-surface-variant outline-none" id="judge_id" name="judge_id" placeholder="Enter your unique ID" required="" type="text"/>
</div>
</div>
<div class="space-y-sm relative">
<label class="block font-label-bold text-label-bold text-on-surface" for="access_code">Secure Access Code</label>
<div class="relative">
<span class="absolute inset-y-0 left-0 flex items-center pl-sm pointer-events-none">
<span class="material-symbols-outlined text-outline">lock</span>
</span>
<input class="w-full pl-xl pr-sm py-sm bg-surface rounded-lg border-2 border-outline focus:border-primary focus:ring-4 focus:ring-primary/20 transition-all font-body-md text-body-md text-on-surface placeholder-on-surface-variant outline-none" id="access_code" name="access_code" placeholder="••••••••" required="" type="password"/>
<button class="absolute inset-y-0 right-0 flex items-center pr-sm text-outline hover:text-primary transition-colors focus:outline-none" type="button">
<span class="material-symbols-outlined">visibility</span>
</button>
</div>
</div>
<div class="flex items-center justify-between pt-sm">
<div class="flex items-center">
<input class="h-5 w-5 rounded border-2 border-outline text-primary focus:ring-primary bg-surface cursor-pointer" id="remember-me" name="remember-me" type="checkbox"/>
<label class="ml-sm block font-body-md text-body-md text-on-surface-variant cursor-pointer" for="remember-me">
                                    Keep session active
                                </label>
</div>
<div class="text-sm">
<a class="font-label-bold text-label-bold text-primary hover:text-secondary underline transition-colors" href="#">Support</a>
</div>
</div>
<button class="w-full bg-primary text-on-primary font-headline-md text-headline-md py-sm px-md rounded-xl hover:bg-on-primary-container hover:text-primary-fixed focus:outline-none focus:ring-4 focus:ring-primary/30 transition-all active:translate-y-0.5 flex justify-center items-center gap-xs" type="submit">
                            Authenticate <span class="material-symbols-outlined">arrow_forward</span>
</button>
</form>
<div class="mt-lg pt-md border-t-2 border-outline-variant text-center">
<p class="font-label-bold text-label-bold text-error flex items-center justify-center gap-xs">
<span class="material-symbols-outlined" data-weight="fill">warning</span>
                            NO BURGERS ALLOWED.
                        </p>
<p class="font-body-md text-body-md text-on-surface-variant mt-xs text-sm">
                            Authorized judging panel members only. Violators will be expelled.
                        </p>
</div>
</div>
</div>
<div class="mt-lg text-center font-body-md text-body-md text-on-surface-variant opacity-70">
                © 2024 International Sandwich Championship
            </div>
</div>
</main>
